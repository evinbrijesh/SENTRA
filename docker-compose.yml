# Sentra — Docker Compose
# Brings up the full "real services" stack from the PRD Section 6:
#   - postgres  : transactional truth (accounts, transactions, payment_methods)
#   - neo4j     : relationship layer (account<->device, account<->ip, referrals)
#   - api       : FastAPI — detection, /rings, /ingest, /evaluate
#   - web       : React dashboard (Vite dev server, proxies /api -> api:8000)
# The api container bootstraps itself on first start: it generates the synthetic
# data, trains the ML model, and loads the initial batch into the databases
# (best-effort — the API still serves CSV-backed detection if the DBs are down).
# Usage:
#     cp .env.example .env        # optional, defaults below match
#     docker compose up --build
#     # API:    http://localhost:8000/docs
#     # Dashboard: http://localhost:5173

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentra}
      POSTGRES_USER: ${POSTGRES_USER:-sentra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentra} -d ${POSTGRES_DB:-sentra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.23
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # bolt port listener check via bash (the container /bin/sh is dash, so
      # /dev/tcp must be evaluated under bash explicitly)
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/7687'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentra}
      POSTGRES_USER: ${POSTGRES_USER:-sentra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  web:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - api
    environment:
      VITE_API_TARGET: "http://api:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
